<body>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/></svg>Entrenar</button>

    <button role="tab" aria-selected="false" data-tab="rec">

    <button role="tab" aria-selected="false" data-tab="more">

  </div>
</nav>
